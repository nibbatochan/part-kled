<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lite hero test page</title>
    <style>
      html, body { margin: 0; background: #050506; color: #f4f4f2; font-family: system-ui, sans-serif; }
      .hero { position: relative; width: 100%; height: 100vh; overflow: hidden; }
      .copy { position: absolute; left: 6vw; bottom: 8vh; z-index: 5; max-width: 28ch; pointer-events: none; }
      .copy h1 { font-size: clamp(32px, 5vw, 72px); font-weight: 500; margin: 0 0 8px; letter-spacing: -0.02em; }
      .below { height: 120vh; padding: 10vh 6vw; }
    </style>
  </head>
  <body>
    <section class="hero" id="hero">
      <div class="copy"><h1>Sumanth Reddy</h1><p>Portfolio hero, lite engine.</p></div>
    </section>
    <section class="below"><p>Scroll target: the hero pauses when it leaves the screen.</p></section>
    <script type="module">
      import { createHero } from '/src/hero-lite.ts';
      const q = new URLSearchParams(location.search);
      window.hero = createHero(document.getElementById('hero'), {
        image: '/samples/sample-1.png',
        depth: '/samples/sample-1-depth.png',
        fit: 'contain',
        alignX: Number(q.get('x') ?? 0.6),
        pointCount: q.get('n') ? Number(q.get('n')) : 'auto',
      });
    </script>
  </body>
</html>
