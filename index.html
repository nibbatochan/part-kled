<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>PARTICLE DEPTH STUDIO — BY SUMANTH REDDY</title>
    <link rel="stylesheet" href="/src/ui/tokens.css" />
    <link rel="stylesheet" href="/src/ui/panel.css" />
  </head>
  <body>
    <div id="app">
      <!-- Left: the stage. The canvas, its frame marks, the drop prompt, the loader, PAN and DRIFT live here. -->
      <main id="stage-wrap" class="stage-wrap">
        <canvas id="stage"></canvas>

        <div id="frame-overlay" class="frame-overlay">
          <svg id="frame-svg" class="frame-svg" width="100%" height="100%"></svg>
          <div id="frame-readout" class="frame-readout">01 / 01 &nbsp; 3B4E83186AA6E41A83DDEE</div>
        </div>

        <!-- Bottom left of the canvas: PAN (hand), 3D, and FULL SCREEN -->
        <div class="stage-tools">
          <div id="stage-pan" class="stage-pan">
            <div id="pan-panel" class="pan-panel hidden">
              <div class="pan-group">
                <div class="row">
                  <span class="row-label" title="The picture turns in 3D toward the mouse">CURSOR</span>
                  <div class="seg">
                    <button class="toggle-btn" data-toggle="panMode">ON</button>
                  </div>
                </div>
                <div class="slider-group" data-param="panAmount">
                  <label for="sl-pan" title="How far the picture turns toward the mouse">AMOUNT</label>
                  <input type="range" id="sl-pan" data-path="panAmount" data-format="pct" min="0" max="1" step="0.01" />
                  <output></output>
                </div>
              </div>
              <div class="pan-float">
                <div class="row">
                  <span class="row-label" title="The picture hovers up and down slowly">FLOAT</span>
                  <div class="seg">
                    <button class="toggle-btn" data-toggle="floatOn">ON</button>
                  </div>
                </div>
              </div>
            </div>
            <button id="pan-icon" class="round-btn" type="button" title="Pan" aria-label="Pan" aria-expanded="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V6a1.5 1.5 0 0 1 3 0v5M11 11V4a1.5 1.5 0 0 1 3 0v7M14 11V5.5a1.5 1.5 0 0 1 3 0V13M17 9.5a1.5 1.5 0 0 1 3 0V15a7 7 0 0 1-7 7h-1.5a6 6 0 0 1-4.6-2.2L4 15.3a1.6 1.6 0 0 1 2.3-2.2L8 15"/></svg></button>
          </div>
          <button id="threed-btn" class="round-btn" type="button" title="3D: drag to rotate in any direction, wheel to move through the picture" aria-label="3D" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3zM4 7.5l8 4.5 8-4.5M12 12v9"/></svg>
          </button>
          <button id="fullscreen-btn" class="round-btn" type="button" title="Fullscreen (F)" aria-label="Full screen">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          </button>
        </div>

        <!-- DRIFT: the compass at the bottom right of the canvas, with ANGLE above and STRENGTH below it -->
        <div id="stage-drift" class="stage-drift">
          <div id="line-widget" class="line-widget-box" role="slider" tabindex="0"
               aria-label="Drift direction" title="Drag to aim the drift. Distance from centre sets strength. Double-click to reset.">
            <svg id="line-svg" width="56" height="56" viewBox="0 0 88 88">
              <circle class="dial-ring" cx="44" cy="44" r="40" />
              <g class="dial-ticks">
                <line x1="44" y1="4" x2="44" y2="9" />
                <line x1="84" y1="44" x2="79" y2="44" />
                <line x1="44" y1="84" x2="44" y2="79" />
                <line x1="4" y1="44" x2="9" y2="44" />
              </g>
              <line id="line-vector" class="dial-vector" x1="44" y1="44" x2="44" y2="44" />
              <polygon id="line-arrow" class="dial-arrow" points="0,0" />
              <circle id="line-handle-end" class="dial-handle" cx="44" cy="44" r="4.5" />
              <circle class="dial-center" cx="44" cy="44" r="1.8" />
            </svg>
          </div>
          <div class="drift-col">
            <div class="drift-fields">
              <label for="in-angle">ANGLE</label>
              <input type="number" id="in-angle" min="-180" max="180" step="1" value="0" />
            </div>
            <div class="drift-fields">
              <label for="in-strength">STRENGTH</label>
              <input type="number" id="in-strength" min="25" max="100" step="1" value="90" />
            </div>
          </div>
        </div>

        <div id="dropzone" class="dropzone-overlay hidden">
          <div class="dropzone-box">
            <div class="dropzone-title">DROP UP TO FIVE PICTURES</div>
            <div class="dropzone-sub">SPACE TURNS THE PAGE · S LIGHTS IT</div>
            <button id="dropzone-picker-btn" class="dropzone-btn">CHOOSE PICTURES</button>
          </div>
        </div>

        <div id="loading-indicator" class="loading-indicator hidden">
          <span id="loading-text">ESTIMATING DEPTH...</span>
          <div class="progress-bar">
            <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
          </div>
        </div>
      </main>

      <!-- Right: the console. Compact boxed sections on a grid. -->
      <aside id="ui-layer" class="console">
        <header class="con-head">
          <h1 class="app-title">PARTICLE DEPTH STUDIO</h1>
          <span class="meta">DEPTH ANYTHING V2 · SUMANTH REDDY</span>
        </header>

        <section class="box">
          <h2><i>01</i> SOURCE</h2>
          <div class="strip" id="thumbnail-strip">
            <div class="thumb-slot active" data-index="0">
              <span class="slot-num">1</span>
              <div class="slot-box" id="thumb-preview-0"></div>
            </div>
            <div class="thumb-slot" data-index="1">
              <span class="slot-num">2</span>
              <div class="slot-box" id="thumb-preview-1"></div>
            </div>
            <button id="add-slot-btn" class="thumb-slot add-slot" title="Add picture" aria-label="Add picture">
              <span class="slot-plus">+</span>
            </button>
            <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp" multiple hidden />
          </div>
        </section>

        <section class="box">
          <h2><i>02</i> MOTION</h2>
          <div class="pair">
            <div class="slider-group" data-param="drift">
              <label for="sl-drift">FLOW</label>
              <input type="range" id="sl-drift" data-path="drift" data-format="pct" min="0" max="1" step="0.01" />
              <output></output>
            </div>
            <div class="slider-group" data-param="depth">
              <label for="sl-depth">DEPTH</label>
              <input type="range" id="sl-depth" data-path="depth" data-format="pct" min="0" max="1" step="0.01" />
              <output></output>
            </div>
            <div class="slider-group" data-param="lean">
              <label for="sl-lean" title="Which side of the picture the particles come from. Centre = all sides.">LEAN</label>
              <input type="range" id="sl-lean" data-path="lean" min="-1" max="1" step="0.01" />
              <output></output>
            </div>
          </div>
        </section>

        <section class="box">
          <h2><i>03</i> MODES</h2>
          <div class="row">
            <span class="row-label">HOVER</span>
            <div class="seg">
              <button class="toggle-btn" data-toggle="track">ON</button>
              <button class="mode-btn" data-trackstyle="old" title="Harsh: repels and follows the cursor's motion">HARSH</button>
              <button class="mode-btn" data-trackstyle="soft" title="Gentle push away from the cursor">SOFT</button>
            </div>
          </div>
          <div class="row">
            <span class="row-label">SCANNER</span>
            <div class="seg">
              <button class="toggle-btn" data-toggle="scan">ON</button>
              <button class="toggle-btn scan-mode-btn" id="scan-mode-btn" type="button" title="Change scan style" aria-label="Change scan style">↻ <span id="scan-mode-label">SWEEP</span></button>
              <button class="toggle-btn step-btn" id="scan-level-dec" type="button" title="Weaker scan" aria-label="Weaker scan">&minus;</button>
              <output class="level" id="scan-level" title="Scan impact, 1 to 5">3</output>
              <button class="toggle-btn step-btn" id="scan-level-inc" type="button" title="Stronger scan" aria-label="Stronger scan">+</button>
            </div>
          </div>
        </section>

        <section class="box">
          <h2><i>04</i> PARTICLES</h2>
          <div class="pair">
            <div class="slider-group" data-param="randomness">
              <label for="sl-random" title="How much each particle's path differs: direction and distance">RANDOM</label>
              <input type="range" id="sl-random" data-path="randomness" data-format="pct" min="0" max="1" step="0.01" />
              <output></output>
            </div>
            <div class="slider-group" data-param="pSat">
              <label for="sl-psat" title="Saturation of the drifting particles">PART SAT</label>
              <input type="range" id="sl-psat" data-path="pSat" min="0" max="2" step="0.01" />
              <output></output>
            </div>
            <div class="slider-group" data-param="trailSize">
              <label for="sl-tsize" title="Dot size of the drifting particles">SIZE</label>
              <input type="range" id="sl-tsize" data-path="trailSize" min="0.2" max="3" step="0.01" />
              <output></output>
            </div>
            <div class="slider-group" data-param="trailAngle">
              <label for="sl-tangle" title="Turns the trails away from the drift path, in degrees">TRAIL DIR</label>
              <input type="range" id="sl-tangle" data-path="trailAngle" min="-60" max="60" step="1" />
              <output></output>
            </div>
            <div class="slider-group" data-param="trail.length">
              <label for="sl-length" title="How long each particle's trail is">TRAIL LEN</label>
              <input type="range" id="sl-length" data-path="trail.length" min="0.3" max="2" step="0.01" />
              <output></output>
            </div>
            <div class="slider-group" data-param="trail.amount">
              <label for="sl-tamount" title="How many particles leave a trail">TRAIL AMT</label>
              <input type="range" id="sl-tamount" data-path="trail.amount" min="0" max="2" step="0.01" />
              <output></output>
            </div>
          </div>
        </section>

        <section id="fx-panel" class="box">
          <h2><i>05</i> EFFECTS - IMAGE <button id="fx-reset" class="mini" type="button" title="Reset effects"><svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg> RESET</button></h2>
          <div class="pair">
            <div class="slider-group fx-slider" data-path="fx.opacity">
              <label for="fx-fx-opacity">OPACITY</label>
              <input type="range" id="fx-fx-opacity" data-path="fx.opacity" min="0" max="1" step="0.01" />
              <output></output>
            </div>
            <div class="slider-group fx-slider" data-path="fx.black">
              <label for="fx-fx-black">BLACK</label>
              <input type="range" id="fx-fx-black" data-path="fx.black" min="0" max="0.5" step="0.005" />
              <output></output>
            </div>
            <div class="slider-group fx-slider" data-path="fx.white">
              <label for="fx-fx-white">WHITE</label>
              <input type="range" id="fx-fx-white" data-path="fx.white" min="0.5" max="1" step="0.005" />
              <output></output>
            </div>
            <div class="slider-group fx-slider" data-path="fx.gamma">
              <label for="fx-fx-gamma">GAMMA</label>
              <input type="range" id="fx-fx-gamma" data-path="fx.gamma" min="0.4" max="2.2" step="0.01" />
              <output></output>
            </div>
            <div class="slider-group fx-slider" data-path="fx.contrast">
              <label for="fx-fx-contrast">CONTRAST</label>
              <input type="range" id="fx-fx-contrast" data-path="fx.contrast" min="-1" max="1" step="0.01" />
              <output></output>
            </div>
            <div class="slider-group fx-slider" data-path="fx.hue">
              <label for="fx-fx-hue">HUE</label>
              <input type="range" id="fx-fx-hue" data-path="fx.hue" min="-180" max="180" step="1" />
              <output></output>
            </div>
            <div class="slider-group fx-slider" data-path="fx.saturation">
              <label for="fx-fx-saturation">SATURATION</label>
              <input type="range" id="fx-fx-saturation" data-path="fx.saturation" min="0" max="2" step="0.01" />
              <output></output>
            </div>
          </div>
        </section>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
