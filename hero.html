<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sumanth Reddy — Portfolio Hero Embed Demo</title>
    <link rel="stylesheet" href="/src/ui/tokens.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #050506;
        color: #f4f4f2;
        font-family: 'Manrope', sans-serif;
        min-height: 200vh;
      }
      .hero-section {
        position: relative;
        width: 100%;
        height: 85vh;
        overflow: hidden;
      }
      #hero-container {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .hero-content {
        position: relative;
        z-index: 10;
        max-width: 1100px;
        margin: 0 auto;
        padding: 48px 28px;
        pointer-events: none;
      }
      .nav-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 120px;
        pointer-events: auto;
      }
      .logo {
        font-size: 13px;
        letter-spacing: 0.35em;
        font-weight: 600;
        text-decoration: none;
        color: #f4f4f2;
      }
      .nav-links {
        display: flex;
        gap: 28px;
      }
      .nav-links a {
        color: rgba(244, 244, 242, 0.6);
        text-decoration: none;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        transition: color 0.2s;
      }
      .nav-links a:hover {
        color: #f4f4f2;
      }
      .hero-headline {
        pointer-events: auto;
        max-width: 600px;
      }
      h1 {
        font-size: 42px;
        letter-spacing: -0.02em;
        line-height: 1.1;
        margin-bottom: 20px;
        font-weight: 500;
      }
      p.subtitle {
        font-size: 14px;
        line-height: 1.6;
        color: rgba(244, 244, 242, 0.65);
        margin-bottom: 32px;
        letter-spacing: 0.05em;
        text-transform: none;
      }
      .cta-btn {
        display: inline-block;
        padding: 12px 28px;
        border: 1px solid rgba(244, 244, 242, 0.4);
        color: #f4f4f2;
        text-decoration: none;
        font-size: 10px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        transition: all 0.2s;
        background: rgba(5, 5, 6, 0.4);
        backdrop-filter: blur(8px);
      }
      .cta-btn:hover {
        border-color: #f4f4f2;
        background: #f4f4f2;
        color: #050506;
      }
    </style>
  </head>
  <body>
    <section class="hero-section">
      <div id="hero-container"></div>
      <div class="hero-content">
        <header class="nav-bar">
          <a href="#" class="logo">SUMANTH REDDY</a>
          <nav class="nav-links">
            <a href="#work">Work</a>
            <a href="#experiments">Experiments</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
          </nav>
        </header>
        <div class="hero-headline">
          <h1>Particle Depth Studio</h1>
          <p class="subtitle">
            Zero-download runtime header using pre-baked depth and WebGL2 particle simulation. Move your mouse across the hero to interact.
          </p>
          <a href="/" class="cta-btn">Open Full Studio</a>
        </div>
      </div>
    </section>

    <script type="module">
      import { createHero } from '/src/hero.ts';

      const hero = createHero(document.getElementById('hero-container'), {
        image: '/samples/sample-1.png',
        depth: '/samples/sample-1-depth.png',
        poster: '/samples/sample-1.png',
        alt: 'Sumanth Reddy Hero',
        pointer: 'window',
        pointCount: 'auto',
      });
    </script>
  </body>
</html>
